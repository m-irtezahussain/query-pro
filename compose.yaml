services:
  querycraft:
    build:
      context: .
      dockerfile: Dockerfile
    image: querycraft:local
    ports:
      - "${PORT:-3000}:3000"
    environment:
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN:-}"
      CLOUDFLARE_AI_MODEL: "${CLOUDFLARE_AI_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}"
      DB_CONNECTION_ALLOWED_HOSTS: "${DB_CONNECTION_ALLOWED_HOSTS:-}"
      PORT: "3000"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
